<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Home Services Marketing Summit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
  <style>
    :root {
      --brand-ink: #1D1D1C;
      --brand-ink-soft: #3a3a39;
      --brand-paper: #FFFFFF;
      --brand-paper-deep: #f2f3f5;
      --brand-accent: #E0F61F;
      --brand-accent-strong: #c8db00;
      --brand-sage: #5D6E96;
      --brand-line: rgba(29,29,28,0.12);
      --brand-glow: rgba(224,246,31,0.35);
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--brand-ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(224,246,31,0.08), transparent 55%),
        radial-gradient(circle at 85% 8%, rgba(93,110,150,0.10), transparent 45%),
        linear-gradient(180deg, #f8f8f8 0%, #f2f3f5 45%, #ecedf0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--brand-paper);
      border: 1px solid var(--brand-line);
      border-radius: 18px;
      padding: 44px 40px 36px;
      box-shadow: 0 24px 60px rgba(29,29,28,0.08);
    }
    .eyebrow {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.72rem;
      color: var(--brand-ink-soft);
      margin-bottom: 18px;
    }
    .eyebrow::before {
      content: "\25C6  ";
      color: var(--brand-accent-strong);
    }
    h1 {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1.55rem;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin: 0 0 10px;
    }
    p.sub {
      color: var(--brand-ink-soft);
      font-size: 0.95rem;
      line-height: 1.55;
      margin: 0 0 28px;
    }
    label {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.7rem;
      color: var(--brand-ink-soft);
      display: block;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--brand-line);
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--brand-ink);
      background: var(--brand-paper-deep);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    input[type="password"]:focus {
      border-color: var(--brand-ink);
      background: var(--brand-paper);
      box-shadow: 0 0 0 3px var(--brand-glow);
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: var(--brand-ink);
      color: var(--brand-paper);
      border: none;
      border-radius: 10px;
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.05s ease;
    }
    button:hover {
      background: var(--brand-accent);
      color: var(--brand-ink);
    }
    button:active { transform: translateY(1px); }
    .error {
      color: #A04473;
      font-size: 0.85rem;
      margin-top: 14px;
      display: none;
      font-family: var(--font-body);
    }
    footer {
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid var(--brand-line);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--brand-ink-soft);
      text-transform: uppercase;
    }
    footer a { color: inherit; text-decoration: underline; text-decoration-color: var(--brand-line); text-underline-offset: 3px; }
    footer a:hover { color: var(--brand-ink); text-decoration-color: var(--brand-accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Home Services Marketing Summit</div>
    <h1>Recap and synthesis</h1>
    <p class="sub">Anonymized notes from the two-day summit. Enter the password to continue.</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="off" autofocus />
      <button type="submit">Continue</button>
      <p class="error" id="error">That is not the password. Try again.</p>
    </form>
    <footer>
      Made by Remix Partners &middot; <a href="https://remixpartners.ai">remixpartners.ai</a>
    </footer>
  </div>
  <script>
    const EXPECTED = '337f11265dbedd05e94cc0a78f377eb757af2748ee0b895db17ae677da6c81d8';
    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    // If already authed, bounce straight in.
    if (sessionStorage.getItem('hssm-auth') === '1' || localStorage.getItem('hssm-auth') === '1') {
      location.replace('./');
    }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const hash = await sha256Hex(password);
      if (hash === EXPECTED) {
        sessionStorage.setItem('hssm-auth', '1');
        localStorage.setItem('hssm-auth', '1');
        location.replace('./');
      } else {
        document.getElementById('error').style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
